<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:3000 wss://localhost:3000; img-src 'self' data:; font-src 'self';">
  <title>Seraphim — End-to-End Encrypted Messaging</title>
  <meta name="description"
    content="Seraphim is a zero-knowledge, end-to-end encrypted messaging platform. Encrypt, decrypt, and chat securely.">
  <link rel="stylesheet" href="style.css">
  <style>
    .nav-reveal {
      opacity: 0;
      transform: translateY(30px);
      animation: navRise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
    }

    @keyframes navRise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <header class="global-header">
    <a href="index.html" class="global-logo">
      <img src="lib/seraphim-logo.png" class="header-svg" alt="Seraphim" onerror="this.style.display='none'">
    </a>
    <nav class="header-nav">
      <a href="index.html">Home</a>
      <a href="encrypt.html">Encrypt</a>
      <a href="decrypt.html">Decrypt</a>
      <a href="keys.html">Keys</a>
      <a href="chat.html">Chat</a>
    </nav>
  </header>

  <main>
    <section class="hero-section"
      style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
      <div class="logo-hero-wrap" style="display:flex;justify-content:center;">
        <img src="lib/seraphim-logo.png" class="logo-hero" alt="Seraphim Logo">
      </div>
      <div class="scroll-indicator"
        style="position: absolute; bottom: 3rem; animation: bounce 2s infinite; opacity: 0.5;">
        ↓ Scroll
      </div>
    </section>

    <section class="menu-section reveal"
      style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 5rem;">
      <p class="tagline nav-reveal" style="margin-bottom:3rem;">zero knowledge · end to end · no logs</p>
      <nav class="nav-list nav-reveal" style="margin:0 auto;width:100%;max-width:420px;">
        <a href="encrypt.html" class="nav-item"><span class="nav-icon">🔒</span> Encrypt Message <span
            class="nav-arrow">→</span></a>
        <a href="decrypt.html" class="nav-item"><span class="nav-icon">🔓</span> Decrypt Message <span
            class="nav-arrow">→</span></a>
        <a href="keys.html" class="nav-item"><span class="nav-icon">🗝</span> Key Manager <span
            class="nav-arrow">→</span></a>
        <a href="chat.html" class="nav-item"><span class="nav-icon">💬</span> Secure Chat <span
            class="nav-arrow">→</span></a>
      </nav>
    </section>
  </main>
  <style>
    @keyframes bounce {

      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-15px);
      }

      60% {
        transform: translateY(-7px);
      }
    }
  </style>

  <script src="animations.js"></script>
</body>

</html>
