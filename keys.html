<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:3000 wss://localhost:3000; img-src 'self' data:; font-src 'self';">
  <title>Seraphim — Key Manager</title>
  <meta name="description" content="Generate, import, and manage PGP keypairs securely in your browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="global-header">
    <a href="index.html" class="global-logo">
      <img src="lib/seraphim-logo.png" class="header-svg" alt="Seraphim" onerror="this.style.display='none'">
    </a>
    <nav class="header-nav">
      <a href="index.html">Home</a>
      <a href="encrypt.html">Encrypt</a>
      <a href="decrypt.html">Decrypt</a>
      <a href="keys.html">Keys</a>
      <a href="chat.html">Chat</a>
    </nav>
  </header>

  <main class="page-content reveal">
    <div class="page-container">
      <div class="page-title">
        <h1>Key Manager</h1>
        <p>Generate, store, and manage your PGP keypairs. Keys are saved in your browser only.</p>
      </div>

      <!-- Generate Key Card -->
      <div class="card" style="margin-bottom:1.5rem;">
        <div class="card-header">
          <div>
            <div class="card-title">Generate New Keypair</div>
            <div class="card-subtitle">ECC Curve25519 — fast, modern, secure</div>
          </div>
        </div>

        <div class="form-row" style="display:flex;gap:1rem;margin-bottom:1.25rem;">
          <div class="form-group" style="flex:1;margin-bottom:0;">
            <label class="form-label" for="gen-name">Name</label>
            <input class="form-input" id="gen-name" placeholder="Your name">
          </div>
          <div class="form-group" style="flex:1;margin-bottom:0;">
            <label class="form-label" for="gen-email">Email</label>
            <input class="form-input" id="gen-email" type="email" placeholder="you@example.com">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="gen-pass">Passphrase</label>
          <input class="form-input" id="gen-pass" type="password" placeholder="Strong passphrase to protect your key">
        </div>

        <button class="btn btn-primary" id="gen-btn" onclick="handleGenerate()">Generate Keys</button>
        <div class="status" id="gen-status"></div>
      </div>

      <!-- Generated Keys Output -->
      <div class="card mt-2" id="gen-output" style="display:none; margin-bottom:1.5rem;">
        <div class="card-header">
          <div>
            <div class="card-title">Generated Keypair</div>
            <div class="card-subtitle" id="gen-fingerprint" style="font-family:var(--font-mono);color:var(--text-silver);"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Public Key</label>
          <div class="output-box" id="gen-pubkey" style="max-height:150px;overflow-y:auto;"></div>
          <button class="btn btn-ghost btn-sm mt-1" onclick="copyEl('gen-pubkey')">Copy Public Key</button>
        </div>

        <div class="form-group">
          <label class="form-label">Private Key</label>
          <div class="output-box" id="gen-privkey" style="max-height:150px;overflow-y:auto;color:var(--text-silver);"></div>
          <button class="btn btn-ghost btn-sm mt-1" onclick="copyEl('gen-privkey')">Copy Private Key</button>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" onclick="saveGenerated()">Save to Browser</button>
        </div>
        <div class="status" id="save-status"></div>
      </div>

      <!-- Saved Keys -->
      <div class="card mt-2" style="margin-bottom:1.5rem;">
        <div class="card-header">
          <div>
            <div class="card-title">My Saved Keys</div>
            <div class="card-subtitle" id="key-count">Loading...</div>
          </div>
        </div>
        <div id="saved-keys" class="key-list"></div>
      </div>

      <!-- Contacts -->
      <div class="card mt-2" style="margin-bottom:1.5rem;">
        <div class="card-header">
          <div>
            <div class="card-title">Contacts</div>
            <div class="card-subtitle">Saved public keys of people you message</div>
          </div>
        </div>
        <div id="contacts-list" class="key-list"></div>
        <div class="mt-2">
          <button class="btn btn-secondary btn-sm" onclick="showAddContact()">Add Contact</button>
        </div>
      </div>

      <!-- Add Contact Modal -->
      <div id="add-contact-modal" class="hidden">
        <div class="modal-overlay" onclick="if(event.target===this)hideAddContact()">
          <div class="card modal-content">
            <div class="card-header">
              <div><div class="card-title">Add Contact</div></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="contact-name">Name</label>
              <input class="form-input" id="contact-name" placeholder="Contact name">
            </div>
            <div class="form-group">
              <label class="form-label" for="contact-pubkey">Public Key</label>
              <textarea class="form-textarea" id="contact-pubkey" placeholder="Paste their public key"></textarea>
            </div>
            <div class="btn-group">
              <button class="btn btn-primary" onclick="addContact()">Save Contact</button>
              <button class="btn btn-ghost" onclick="hideAddContact()">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="lib/openpgp.min.js"></script>
  <script src="crypto.js"></script>
  <script>
    let lastGenerated = null;

    function showStatus(id, type, msg) {
      const el = document.getElementById(id);
      el.className = `status show ${type}`;
      el.textContent = msg;
    }

    function copyEl(id) {
      navigator.clipboard.writeText(document.getElementById(id).textContent);
    }

    // Generate
    async function handleGenerate() {
      const name = document.getElementById('gen-name').value.trim();
      const email = document.getElementById('gen-email').value.trim();
      const pass = document.getElementById('gen-pass').value;
      const btn = document.getElementById('gen-btn');

      if (!name) return showStatus('gen-status', 'error', '⚠ Name required.');
      if (!email) return showStatus('gen-status', 'error', '⚠ Email required.');
      if (!pass || pass.length < 6) return showStatus('gen-status', 'error', '⚠ Passphrase must be 6+ chars.');

      btn.disabled = true;
      btn.innerHTML = 'Generating...';
      try {
        const keys = await SeraphimCrypto.generateKeyPair(name, email, pass);
        const fp = await SeraphimCrypto.getFingerprint(keys.publicKey);
        lastGenerated = { ...keys, name, email, fingerprint: fp };

        document.getElementById('gen-pubkey').textContent = keys.publicKey;
        document.getElementById('gen-privkey').textContent = keys.privateKey;
        document.getElementById('gen-fingerprint').textContent = 'Fingerprint: ' + fp;
        document.getElementById('gen-output').style.display = 'block';
        showStatus('gen-status', 'success', '✓ Keypair generated!');
      } catch (e) {
        showStatus('gen-status', 'error', '✗ ' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Generate Keys';
      }
    }

    function saveGenerated() {
      if (!lastGenerated) return;
      const keys = JSON.parse(localStorage.getItem('seraphim_keys') || '[]');
      keys.push({
        id: crypto.randomUUID(),
        name: lastGenerated.name,
        email: lastGenerated.email,
        publicKey: lastGenerated.publicKey,
        privateKey: lastGenerated.privateKey,
        fingerprint: lastGenerated.fingerprint,
        createdAt: new Date().toISOString()
      });
      localStorage.setItem('seraphim_keys', JSON.stringify(keys));
      showStatus('save-status', 'success', '✓ Saved to browser!');
      renderKeys();
    }

    // Render saved keys
    function renderKeys() {
      const keys = JSON.parse(localStorage.getItem('seraphim_keys') || '[]');
      const el = document.getElementById('saved-keys');
      document.getElementById('key-count').textContent = keys.length + ' keypair(s)';

      if (keys.length === 0) {
        el.innerHTML = '<p class="text-muted text-sm text-center">No saved keys yet. Generate one above.</p>';
        return;
      }

      el.innerHTML = keys.map((k, i) => `
        <div class="list-item">
          <div class="list-item-header">
            <div>
              <div class="list-item-title">${k.name}</div>
              <div class="list-item-subtitle">${k.email || ''}</div>
            </div>
            <div class="btn-group">
              <button class="btn btn-ghost btn-sm" onclick="exportKey(${i},'pub')" title="Copy public key">Pub Key</button>
              <button class="btn btn-ghost btn-sm" onclick="exportKey(${i},'priv')" title="Copy private key">Priv Key</button>
              <button class="btn btn-killswitch" style="padding:4px 8px;font-size:11px;" onclick="deleteKey(${i})">Delete</button>
            </div>
          </div>
          <div class="list-item-meta">${k.fingerprint || 'N/A'}</div>
        </div>
      `).join('');
    }

    function exportKey(idx, type) {
      const keys = JSON.parse(localStorage.getItem('seraphim_keys') || '[]');
      const text = type === 'pub' ? keys[idx].publicKey : keys[idx].privateKey;
      navigator.clipboard.writeText(text);
    }

    function deleteKey(idx) {
      if (!confirm('Delete this keypair? This cannot be undone.')) return;
      const keys = JSON.parse(localStorage.getItem('seraphim_keys') || '[]');
      keys.splice(idx, 1);
      localStorage.setItem('seraphim_keys', JSON.stringify(keys));
      renderKeys();
    }

    // Contacts
    function renderContacts() {
      const contacts = JSON.parse(localStorage.getItem('seraphim_contacts') || '[]');
      const el = document.getElementById('contacts-list');
      if (contacts.length === 0) {
        el.innerHTML = '<p class="text-muted text-sm text-center">No contacts saved.</p>';
        return;
      }
      el.innerHTML = contacts.map((c, i) => `
        <div class="list-item">
          <div class="list-item-header">
            <div class="list-item-title">${c.name}</div>
            <div class="btn-group">
              <button class="btn btn-ghost btn-sm" onclick="copyContactKey(${i})">Copy Key</button>
              <button class="btn btn-killswitch" style="padding:4px 8px;font-size:11px;" onclick="deleteContact(${i})">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function copyContactKey(idx) {
      const contacts = JSON.parse(localStorage.getItem('seraphim_contacts') || '[]');
      navigator.clipboard.writeText(contacts[idx].publicKey);
    }

    function deleteContact(idx) {
      if (!confirm('Remove this contact?')) return;
      const contacts = JSON.parse(localStorage.getItem('seraphim_contacts') || '[]');
      contacts.splice(idx, 1);
      localStorage.setItem('seraphim_contacts', JSON.stringify(contacts));
      renderContacts();
    }

    function showAddContact() { document.getElementById('add-contact-modal').classList.remove('hidden'); }
    function hideAddContact() { document.getElementById('add-contact-modal').classList.add('hidden'); }

    function addContact() {
      const name = document.getElementById('contact-name').value.trim();
      const pk = document.getElementById('contact-pubkey').value.trim();
      if (!name || !pk) return alert('Name and public key required.');
      const contacts = JSON.parse(localStorage.getItem('seraphim_contacts') || '[]');
      contacts.push({ id: crypto.randomUUID(), name, publicKey: pk });
      localStorage.setItem('seraphim_contacts', JSON.stringify(contacts));
      hideAddContact();
      renderContacts();
      document.getElementById('contact-name').value = '';
      document.getElementById('contact-pubkey').value = '';
    }

    // Init
    renderKeys();
    renderContacts();
  </script>
  <script src="animations.js"></script>
</body>
</html>
