<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>Crypto tests — Ophanim</title>

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%2355a08c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23e7e3d9' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e7e3d9'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="src/css/fonts.css">
  <link rel="stylesheet" href="src/css/ophanim.css">
  <style>
    #output {
      background: var(--ink-deep);
      border: 1px solid var(--rule);
      border-radius: var(--r);
      padding: var(--s5);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 70vh;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 0.75rem;
      line-height: 1.7;
      color: var(--bone-3);
    }

    .pass { color: var(--verdigris); }
    .fail { color: var(--oxide); }
    .info { color: var(--bone); }
    .dim  { color: var(--bone-4); }
  </style>
</head>

<body>

  <main class="main" id="main-content" style="margin-right:0">
    <div class="wrap" style="max-width:820px">

      <div class="page-head">
        <div>
          <h1 class="page-title">Crypto tests</h1>
          <p class="page-lede">
            Runs a keypair through generation, encryption, decryption, signing and verification
            in this browser, and reports how long each step took.
          </p>
        </div>
        <button class="btn btn-primary" id="run-btn">Run tests</button>
      </div>

      <div id="output">Press “Run tests” to begin.</div>

      <p class="panel-note" style="margin-top:var(--s5)">
        <a href="index.html" style="color:var(--verdigris)">Back to Ophanim</a>
      </p>

    </div>
  </main>

  <script src="public/assets/openpgp.min.js"></script>
  <script src="src/js/crypto.js"></script>
  <script src="src/js/test-runner.js"></script>
  <script>
    document.getElementById('run-btn').addEventListener('click', runTests);
  </script>
</body>

</html>
