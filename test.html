<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:3000 wss://localhost:3000; img-src 'self' data:; font-src 'self';">
  <title>Ophanim — Crypto Test</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .test-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;
    }
    #output {
      background: var(--bg-surface);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      padding: 1.5rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 80vh;
      overflow-y: auto;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      color: var(--text-silver);
    }
    .pass { color: var(--text-primary); }
    .fail { color: var(--danger); }
    .info { color: var(--text-secondary); }
    .dim  { color: var(--text-muted); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="index.html" class="global-logo">
      <img src="lib/ophanim-logo.png" class="header-svg" alt="Ophanim" onerror="this.style.display='none'">
    </a>
    <nav class="header-nav">
      <a href="index.html">Home</a>
      <a href="encrypt.html">Encrypt</a>
      <a href="decrypt.html">Decrypt</a>
      <a href="keys.html">Keys</a>
      <a href="chat.html">Chat</a>
    </nav>
  </header>

  <main class="page-content reveal">
    <div class="page-container">
      <div class="test-header">
        <div class="page-title" style="margin-bottom:0;">
          <h1>Crypto Test Suite</h1>
          <p>Run internal cryptographic benchmarks.</p>
        </div>
        <button class="btn btn-primary" id="run-btn">Run All Tests</button>
      </div>

      <div id="output">Click "Run All Tests" to begin...</div>
    </div>
  </main>

  <script src="lib/openpgp.min.js"></script>
  <script src="crypto.js"></script>
  <script src="test-runner.js"></script>
  <script>
    // Wire up button — must be in separate script tag after test-runner loads
    document.getElementById('run-btn').addEventListener('click', runTests);
  </script>
  <script src="animations.js"></script>
</body>
</html>
